name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! This is an independent project, so not every
        request will be built, but well-described use cases are always welcome.

  - type: textarea
    id: problem
    attributes:
      label: What's the problem or use case?
      description: What are you trying to do, and where does the plugin fall short today?
      placeholder: e.g. I export retros to share in Slack, but plain text loses the section grouping.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the plugin to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help, such as examples, screenshots, or links.
    validations:
      required: false
